<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - AniStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <a href="Category.html" class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                        𝔸
                    </a>
                </div>
                <nav class="hidden md:flex items-center gap-6 text-sm">
                    <a href="Category.html" class="text-gray-600 hover:text-gray-900 transition-colors">Products</a>
                    <a href="wishlist.html" class="text-gray-600 hover:text-gray-900 transition-colors flex items-center gap-1">
                        Wishlist
                        <span id="wishlist-count" class="w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center hidden">0</span>
                    </a>
                </nav>
                <div id="nav-right" class="flex items-center gap-4">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Your Shopping Cart</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Cart Items -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden" id="cart-items-container">
                    <!-- Cart items will be injected here -->
                </div>
                
                <a href="Category.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900 mt-6 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Continue Shopping
                </a>
            </div>

            <!-- Order Summary -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sticky top-24">
                    <h2 class="text-lg font-semibold text-gray-900 mb-6">Order Summary</h2>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Tax</span>
                            <span id="tax">$0.00</span>
                        </div>
                    </div>
                    
                    <hr class="border-gray-200 mb-6">
                    
                    <div class="flex justify-between text-gray-900 font-bold text-lg mb-6">
                        <span>Total</span>
                        <span id="total">$0.00</span>
                    </div>
                    
                    <button id="checkout-btn" class="w-full py-3 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div>
                    <div class="text-white text-2xl font-bold mb-4">𝔸</div>
                </div>
            </div>
            <div class="border-t border-gray-800 mt-12 pt-8 text-center text-sm">
                <p>© 2024 AniStore. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // Product data (shared with Category.html)
        const products = [
            { id: 0, name: "Satoru Gojo: Cursed Technique Reversal \"Red\" 1/7", price: 245.00, image: "/images/gojo.jpg" },
            { id: 1, name: "Makima 1/8 Scale Figure by Kotobukiya", price: 189.99, image: "/images/makima.jpg" },
            { id: 2, name: "Nendoroid Naruto Uzumaki (Re-run)", price: 54.00, image: "/images/naruto.jpg" },
            { id: 3, name: "Power 1/7 Scale Figure by Good Smile Company", price: 215.00, image: "/images/power.jpg" },
            { id: 4, name: "Megumi Fushiguro: ARTFX J 1/8", price: 145.00, image: "/images/megumi.jpg" },
            { id: 5, name: "Nendoroid Denji", price: 59.99, image: "/images/denji.jpg" },
            { id: 6, name: "Tanjiro Kamado 1/7 Scale Figure", price: 179.99, image: "/images/tanjiro.jpg" },
            { id: 7, name: "Monkey D. Luffy Nendoroid", price: 65.00, image: "/images/luffy.jpg" }
        ];

        // Load cart from localStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Helper for safe wishlist storage retrieval
        function getWishlistFromStorage() {
            try {
                const raw = localStorage.getItem('wishlist');
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];
                return parsed.map(n => Number(n)).filter(n => !isNaN(n));
            } catch (e) {
                return [];
            }
        }

        // Helper: format currency
        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        // Function to update navbar
        function updateNavbar() {
            const navRight = document.getElementById('nav-right');
            if (!navRight) return;

            const token = localStorage.getItem('token');
            let user = null;
            try { user = JSON.parse(localStorage.getItem('user')); } catch(e) {}

            if (token && user) {
                navRight.innerHTML = `
                    <span class="text-gray-600 text-sm">Hi, ${user.fullName}</span>
                    <button id="logout-btn" class="px-4 py-2 text-sm font-medium bg-gray-100 text-gray-900 rounded-lg hover:bg-gray-200 transition-colors">Logout</button>
                `;
                const logoutBtn = document.getElementById('logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.reload();
                    });
                }
            } else {
                navRight.innerHTML = `
                    <a href="index.html" class="text-sm text-gray-600 hover:text-gray-900">Sign in</a>
                    <a href="index.html" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-lg hover:bg-gray-800 transition-colors">Register</a>
                `;
            }
        }

        // Function to render cart items
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="p-12 text-center">
                        <svg class="w-24 h-24 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        <h3 class="text-xl font-medium text-gray-900 mb-2">Your cart is empty</h3>
                        <p class="text-gray-500 mb-6">Looks like you haven't added anything yet.</p>
                        <a href="Category.html" class="inline-block px-6 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-800 transition-colors">
                            Start Shopping
                        </a>
                    </div>
                `;
            } else {
                let html = '';
                cart.forEach(cartItem => {
                    const product = products.find(p => p.id === cartItem.id);
                    if (!product) return;
                    html += `
                        <div class="p-6 border-b border-gray-100 last:border-b-0 flex items-center gap-6">
                            <img src="${product.image}" alt="${product.name}" class="w-24 h-24 object-cover rounded-lg">
                            <div class="flex-grow">
                                <h3 class="text-sm font-semibold text-gray-900 mb-1">${product.name}</h3>
                                <p class="text-sm text-gray-500 mb-4">${formatCurrency(product.price)}</p>
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center border border-gray-200 rounded-lg">
                                        <button class="px-3 py-1 text-gray-500 hover:bg-gray-50 transition-colors" onclick="updateQuantity(${product.id}, ${cartItem.quantity - 1})">-</button>
                                        <span class="px-4 py-1 text-gray-800 border-x border-gray-200">${cartItem.quantity}</span>
                                        <button class="px-3 py-1 text-gray-500 hover:bg-gray-50 transition-colors" onclick="updateQuantity(${product.id}, ${cartItem.quantity + 1})">+</button>
                                    </div>
                                    <button class="text-red-500 hover:text-red-700 text-sm font-medium transition-colors" onclick="removeItem(${product.id})">Remove</button>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-semibold text-gray-900">${formatCurrency(product.price * cartItem.quantity)}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
            
            updateCartCount();
            updateWishlistCount();
            updateTotals();
        }

        // Function to update cart count
        function updateCartCount() {
            const cartCount = cart.reduce((total, item) => total + item.quantity, 0);
            const cartCountEl = document.getElementById('cart-count');
            if (cartCountEl) {
                if (cartCount > 0) {
                    cartCountEl.textContent = cartCount;
                    cartCountEl.classList.remove('hidden');
                } else {
                    cartCountEl.classList.add('hidden');
                }
            }
        }

        // Function to update wishlist count
        function updateWishlistCount() {
            const wishlist = getWishlistFromStorage();
            const countEl = document.getElementById('wishlist-count');
            if (countEl) {
                if (wishlist.length > 0) {
                    countEl.textContent = wishlist.length;
                    countEl.classList.remove('hidden');
                } else {
                    countEl.classList.add('hidden');
                }
            }
        }

        // Function to update quantity
        function updateQuantity(id, newQty) {
            if (newQty < 1) return removeItem(id);
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex !== -1) {
                cart[itemIndex].quantity = newQty;
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        // Function to remove item
        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Function to update order totals
        function updateTotals() {
            let subtotal = 0;
            cart.forEach(cartItem => {
                const product = products.find(p => p.id === cartItem.id);
                if (product) {
                    subtotal += product.price * cartItem.quantity;
                }
            });
            const tax = subtotal * 0.08; // 8% tax
            const total = subtotal + tax;

            document.getElementById('subtotal').textContent = formatCurrency(subtotal);
            document.getElementById('tax').textContent = formatCurrency(tax);
            document.getElementById('total').textContent = formatCurrency(total);
        }

        // Checkout button handler
        document.getElementById('checkout-btn').addEventListener('click', async () => {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            try {
                const checkoutItems = cart.map(cartItem => {
                    const product = products.find(p => p.id === cartItem.id);
                    return {
                        name: product.name,
                        price: product.price,
                        quantity: cartItem.quantity
                    };
                });

                // Fetch publishable key securely from server (never hardcode in HTML)
                const configRes = await fetch('/api/config');
                const { publishableKey } = await configRes.json();

                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: checkoutItems })
                });

                const sessionData = await response.json();

                if (sessionData.sessionId) {
                    const stripe = Stripe(publishableKey);
                    await stripe.redirectToCheckout({ sessionId: sessionData.sessionId });
                } else {
                    throw new Error(sessionData.error || 'Checkout session failed');
                }
            } catch (error) {
                console.error('Checkout error:', error);
                alert('Checkout failed: ' + error.message);
            }
        });

        // Initialize safely
        function initPage() {
            try { updateNavbar(); } catch (e) { console.error(e); }
            try { renderCart(); } catch (e) { console.error(e); }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
